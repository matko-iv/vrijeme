<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrihjeme – Matija Ivanović</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
		

        body {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.6;
            color: #24292e;
            background: #fbfcfd;
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.25;
            color: #24292e;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 48px;
            margin-bottom: 16px;
            line-height: 1.25;
            color: #24292e;
            padding-bottom: 8px;
            border-bottom: 1px solid #d0d7de;
        }

        h3 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 14px;
            color: #24292e;
        }

        p {
            margin-bottom: 18px;
            color: #24292e;
        }

        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin-bottom: 36px;
            padding-bottom: 16px;
            border-bottom: 1px solid #d8dee4;
            font-size: 13px;
        }

        .site-header a {
            color: #586069;
            text-decoration: none;
        }

        .site-header a:hover {
            color: #24292e;
        }

        .site-header .site-name {
            font-weight: 600;
            color: #24292e;
        }

        .site-header nav a {
            margin: 0;
        }

        .generated-time {
            color: #586069;
            font-size: 12px;
            margin-bottom: 28px;
        }

        .method-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 3px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            color: #24292e;
            font-size: 13px;
            font-weight: 500;
        }

        .note {
            border-left: 2px solid #d0d7de;
            padding: 4px 0 4px 16px;
            margin: 24px 0;
            font-size: 14px;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            width: 100%;
            margin: 24px 0 36px;
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
        }

        .current-weather {
            padding: 24px 0;
            margin: 0 0 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
        }

        /* Hairline behind the icon: structure instead of a colored edge. */
        .current-weather .cw-icon {
            flex-shrink: 0;
            padding-right: 24px;
            border-right: 1px solid #eaeef2;
        }

        .current-weather .cw-main {
            flex: 1;
        }

        .current-weather .cw-label {
            font-size: 13px;
            color: #586069;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .current-weather .cw-temp {
            font-size: 48px;
            font-weight: 700;
            color: #24292e;
            line-height: 1;
        }

        .current-weather .cw-desc {
            font-size: 16px;
            color: #586069;
            margin-top: 4px;
        }

        .current-weather .cw-details {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .current-weather .cw-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #586069;
        }

        .current-weather .cw-detail span {
            color: #24292e;
            font-weight: 600;
        }

        /* Weather warnings banner — sits above .current-weather. */
        .weather-warnings {
            margin: 0 0 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Severity lives in the solid icon tile, not in a tinted card. */
        .warning-row {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 0;
            padding: 12px 16px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .warning-row .w-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-top: 2px;
        }
        .warning-row.sev-moderate .w-icon { background: #d97706; }
        .warning-row.sev-severe   .w-icon { background: #ea580c; }
        .warning-row.sev-extreme  .w-icon { background: #dc2626; }

        .warning-row .w-text { flex: 1; min-width: 0; }
        .warning-row .w-title {
            font-weight: 600;
            font-size: 15px;
            color: #24292e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .warning-row .w-now-badge {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            padding: 2px 7px;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }
        .warning-row.sev-moderate .w-now-badge { background: #d97706; }
        .warning-row.sev-severe   .w-now-badge { background: #ea580c; }
        .warning-row.sev-extreme  .w-now-badge { background: #dc2626; }

        .warning-row .w-time {
            font-size: 13px;
            color: #586069;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .warning-row .w-details {
            font-size: 13px;
            color: #24292e;
            margin-top: 4px;
        }

        /* When the current hour falls inside an active warning, the card's
           outline and the live dot take the severity color — no tint wash. */
        .current-weather.has-warning-moderate { border-color: #d97706; }
        .current-weather.has-warning-severe   { border-color: #ea580c; }
        .current-weather.has-warning-extreme  { border-color: #dc2626; }

        .day-card {
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            border-left: 1px solid #d0d7de;
        }
        .day-card:first-child { border-left: none; }

        .day-card .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .day-card .day-name {
            font-size: 16px;
            font-weight: 600;
            color: #24292e;
        }

        .day-card .day-date {
            color: #586069;
            font-size: 13px;
        }

        .weather-icon-large {
            font-size: 48px;
            line-height: 1;
        }

        .day-card .weather-desc {
            font-size: 14px;
            color: #586069;
            line-height: 1.4;
        }

        /* The day narrative IS the "dnevni izvještaj" — a quiet note panel,
           hairline all around, no colored edge. */
        .day-card .day-narrative {
            flex: 1;
            font-size: 14px;
            color: #424a53;
            line-height: 1.6;
        }

        .day-card .temp-range {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin: 20px 0 4px;
            font-size: 28px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .temp-high { color: #d73a49; }
        .temp-low { color: #0366d6; }

        .day-details {
            display: grid;
            gap: 5px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e1e4e8;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-size: 12px;
            color: #586069;
        }

        .detail-item img { flex-shrink: 0; }
        .detail-item .detail-icon { font-size: 16px; }
        .detail-item .detail-val { color: #24292e; font-weight: 500; }


        .hourly-strip {
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
            margin: 0 0 36px;
            overflow-x: auto;
        }

        .hourly-strip h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            padding: 12px 16px;
            color: #24292e;
            background: #f6f8fa;
            border-bottom: 1px solid #e1e4e8;
        }

        .hourly-row {
            display: flex;
            gap: 2px;
            min-width: max-content;
            padding: 6px;
        }

        .hourly-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            padding: 14px 8px;
            font-size: 13px;
            border-radius: 0;
            transition: background 0.12s ease;
        }
        /* Night hours get a faint slate tint so the strip reads day/night at
           a glance; a new calendar day starts with a rule + weekday label. */
        .hourly-cell.is-night { background: #f7f9fb; }
        .hourly-cell.is-now {
            background: #f1f8ff;
            box-shadow: inset 0 2px 0 #0366d6;
        }
        .hourly-cell.is-now .h-time { color: #0366d6; }
        .hourly-cell.day-break {
            border-left: 1px solid #d0d7de;
            border-radius: 0;
            margin-left: 8px;
        }
        .hourly-cell .h-day {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #0366d6;
            margin-bottom: 2px;
        }
        .hourly-cell .h-time {
            color: #586069;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .hourly-cell .h-icon { margin-bottom: 6px; }
        .hourly-cell .h-temp {
            font-weight: 700;
            font-size: 20px;
            color: #24292e;
        }
        .hourly-cell .h-rain {
            color: #0550ae;
            border-radius: 3px;
            font-size: 11.5px;
            margin-top: 6px;
            font-weight: 600;
        }
        .hourly-cell .h-rain:empty { display: none; }
        .hourly-cell .h-wind {
            color: #586069;
            font-size: 12px;
            margin-top: 3px;
        }
        .hourly-cell .h-uv {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Marine forecast — sits below Dugorocna prognoza. */
        .marine-section { margin-top: 32px; margin-bottom: 32px; }
        .marine-section h2 { margin-bottom: 6px; }
        .marine-intro {
            font-size: 13.5px;
            color: #57606a;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .marine-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            border-bottom: 1px solid #d0d7de;
        }
        .marine-tab {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #57606a;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .marine-tab:hover { color: #24292e; }
        .marine-tab.active {
            color: #0969da;
            border-bottom-color: #0969da;
            font-weight: 600;
        }
        .marine-panel { display: none; }
        .marine-panel.active { display: block; }
        .marine-loc-desc {
            font-size: 13px;
            color: #6a737d;
            font-style: italic;
            margin-bottom: 12px;
        }
        .marine-daily-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            border: 1px solid #d0d7de;
            border-radius: 0;
            overflow: hidden;
            background: #fff;
            margin-bottom: 18px;
        }
        .m-day {
            padding: 14px 8px;
            text-align: center;
            border-right: 1px solid #e1e4e8;
            font-size: 12.5px;
        }
        .m-day:last-child { border-right: none; }
        .m-day-name { font-weight: 600; color: #24292e; }
        .m-day-date { color: #6a737d; font-size: 11px; margin-bottom: 6px; }
        .m-score-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
            margin: 4px 0;
            color: #fff;
        }
        .m-score-green  { background: #1f883d; }
        .m-score-yellow { background: #d97706; }
        .m-score-orange { background: #ea580c; }
        .m-score-red    { background: #dc2626; }
        .m-score-gray   { background: #6e7781; }
        .m-day-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
            color: #424a53;
            margin-top: 4px;
        }
        .m-day-row b { color: #24292e; font-weight: 600; }
        .m-wind-name {
            font-size: 11px;
            color: #0969da;
            font-style: italic;
            margin-top: 2px;
        }
        .m-wave-dir {
            font-size: 11px;
            color: #6a737d;
        }
        .marine-hourly-wrap {
            border: 1px solid #d0d7de;
            border-radius: 0;
            background: #fff;
            overflow-x: auto;
        }
        .marine-hourly-wrap h4 {
            margin: 0;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #24292e;
            background: #f6f8fa;
            border-bottom: 1px solid #e1e4e8;
        }
        .marine-hourly {
            display: flex;
            gap: 2px;
            min-width: max-content;
            padding: 6px;
        }
        .mh-cell {
            min-width: 64px;
            text-align: center;
            font-size: 11.5px;
            padding: 8px 4px;
            border-radius: 0;
            color: #424a53;
            transition: background 0.12s ease;
        }
        .mh-cell.day-break {
            border-left: 1px solid #d0d7de;
            border-radius: 0;
            margin-left: 8px;
        }
        .mh-day {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #0366d6;
        }
        .mh-time { font-weight: 600; color: #24292e; font-size: 12px; }
        .mh-wave { font-size: 13px; color: #0969da; font-weight: 600; margin-top: 4px; }
        .mh-period { font-size: 10px; color: #6a737d; }
        .mh-wind { font-size: 11px; color: #24292e; margin-top: 4px; }
        .mh-bft { font-size: 10px; color: #6a737d; }
        .m-knots {
            font-size: 10.5px;
            color: #6a737d;
            margin-top: 1px;
        }
        .mh-wind-kn {
            font-size: 9.5px;
            color: #6a737d;
            margin-top: 1px;
        }
        @media (max-width: 768px) {
            .marine-daily-grid {
                grid-template-columns: repeat(7, minmax(80px, 1fr));
                overflow-x: auto;
            }
            .m-day { font-size: 11.5px; padding: 10px 6px; }
        }

        .douglas-scale { margin: 24px 0 8px; }
        .douglas-scale h3 { margin: 0 0 6px; font-size: 18px; color: #24292e; }
        .douglas-intro {
            font-size: 13.5px;
            color: #57606a;
            margin: 0 0 12px;
            line-height: 1.5;
        }
        .douglas-table-wrap {
            border: 1px solid #d0d7de;
            border-radius: 0;
            overflow-x: auto;
            background: #fff;
        }
        .douglas-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        .douglas-table th {
            text-align: left;
            background: #f6f8fa;
            color: #24292e;
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 1px solid #d0d7de;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .douglas-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eaeef2;
            color: #24292e;
            vertical-align: middle;
        }
        .douglas-table tbody tr:last-child td { border-bottom: none; }
        .douglas-table tbody tr:hover { background: #f6f8fa; }
        .d-deg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            border-radius: 3px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
        }
        .d-0 { background: #1f883d; }
        .d-1 { background: #4ea268; }
        .d-2 { background: #bf8700; }
        .d-3 { background: #d97706; }
        .d-4 { background: #ea580c; }
        .d-5 { background: #cf222e; }
        .d-6 { background: #a40e26; }
        .d-7 { background: #82071e; }

        .d-deg-sm {
            width: 18px;
            height: 18px;
            font-size: 10px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .d-en { color: #6a737d; font-size: 12px; font-weight: 400; }
        @media (max-width: 600px) {
            .douglas-table { font-size: 12px; }
            .douglas-table th, .douglas-table td { padding: 8px 10px; }
            .d-en { display: block; margin-top: 2px; }
        }

        .long-range-grid {
            display: block;
            margin: 0 0 36px;
            border-top: 1px solid #d0d7de;
        }

        .lr-card {
            display: grid;
            grid-template-columns: 100px 48px minmax(0, 1fr) auto;
            grid-template-areas: 'date icon condition temp' '. . details details';
            gap: 0 16px;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #d0d7de;
        }

        .lr-day {
            font-weight: 600;
            font-size: 14px;
            color: #24292e;
        }

        .lr-date {
            font-size: 12px;
            color: #586069;
            margin-bottom: 8px;
        }

        .lr-icon { margin: 4px 0; }

        .lr-desc {
            font-size: 13px;
            color: #24292e;
            font-weight: 500;
        }

        .lr-narrative {
            font-size: 13px;
            color: #57606a;
            line-height: 1.5;
        }

        .lr-precip-label {
            font-size: 11px;
            color: #0366d6;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .lr-temp {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .lr-details {
            font-size: 12px;
            color: #586069;
        }

        .lr-details span {
            display: inline-block;
            margin: 4px 14px 0 0;
            font-size: 12px;
        }

        .charts-section {
            margin-bottom: 36px;
        }

        .chart-tabs {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            border-bottom: 1px solid #d0d7de;
        }

        .chart-tab {
            padding: 10px 12px;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #586069;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            flex: 1;
            min-width: 0;
            margin-bottom: -1px;
        }
        .chart-tab:hover {
            background: #f6f8fa;
            color: #24292e;
        }
        .chart-tab:last-child { border-right: none; }

        .chart-tab.active {
            border-bottom-color: #0366d6;
            color: #0366d6;
            font-weight: 600;
        }

        .chart-container {
            padding: 20px 0;
            position: relative;
            height: 340px;
        }

        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0;
            margin-bottom: 36px;
            border: 1px solid #d0d7de;
            border-radius: 0;
            overflow: hidden;
            background: #ffffff;
        }

        .metric-card {
            background: #ffffff;
            border: none;
            border-right: 1px solid #e1e4e8;
            border-radius: 0;
            padding: 16px;
            text-align: left;
        }
        .metric-card:hover {
            background: #fbfcfd;
        }
        .metric-card:last-child { border-right: none; }

        .metric-card .metric-label {
            font-size: 11px;
            color: #586069;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .metric-card .metric-value {
            font-size: 22px;
            font-weight: 700;
            margin: 4px 0;
            color: #24292e;
        }

        .metric-card .metric-improvement {
            font-size: 12px;
            color: #28a745;
            font-weight: 500;
        }

        .footer {
            text-align: left;
            color: #586069;
            font-size: 13px;
            padding: 22px 0 4px;
            margin-top: 32px;
            border-top: 1px solid #d0d7de;
        }

        .footer a { color: #0366d6; }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #586069;
            font-size: 14px;
            border: 1px solid #e1e4e8;
            border-radius: 0;
            background: #ffffff;
        }

        .loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e1e4e8;

// ---- SKALA gating of near-term rain icons ----
// radarState (SKALA RAIN) is populated by refreshRadar(); null/stale = no gating.
let radarState = null;
// SKALA NOWCAST (DGMR) forecast status — the PRIMARY near-term driver now; SKALA
// RAIN is only the fallback when the nowcast is missing/stale. Set by refreshRadar().
let nowcastState = null;
function nowcastFresh(ns) {
    // the forecast BASE time (not the run time) must be within the ~80-min skill
    // window — an old run can't drive 'now', and this also rejects a stale/demo file.
    if (!ns || !ns.ok || !ns.base_epoch_ms) return false;
    return (Date.now() - ns.base_epoch_ms) / 60000 <= 90;
}
// A bucket must cover at least this much of a clock hour before the nowcast is
// allowed to contradict the model (strip its rain) or to restate a full-hour mm.
const HOUR_COVER_MIN = 30;
// The nowcast's clock-hour bucket for a cell: hourly_mm[].hour is UTC, the cell's
// datetime is local, so join on the epoch (DST-safe). Each bucket carries mm,
// covered_min, peak_point_mmh (AT Budva) and peak_disc_mmh (the ~8 km region).
// null = the DGMR horizon doesn't reach this hour -> no opinion.
function nowcastHour(ns, datetime) {
    if (!ns || !datetime) return null;
    const t = new Date(datetime).getTime();
    if (isNaN(t)) return null;
    for (const b of (ns.hourly_mm || [])) {
        if (Date.parse(b.hour) === t) return b;
    }
    return null;
}
// peak_point_mmh / peak_disc_mmh are newer generator fields. A fresh nowcast_status.json
// written before the generator was redeployed carries mm/covered_min but no peaks — that
// bucket has NO opinion on rain vs no rain, so it may drive neither the icon nor the mm.
// Absent is not 0: an explicit 0 means "measured dry at Budva" and still gates.
function nowcastHasPeaks(bucket) {
    return !!bucket && bucket.peak_point_mmh != null && bucket.peak_disc_mmh != null;
}
// The mm to show for a cell, or null = keep the model's. A partly covered hour is
// still the honest number for the CURRENT hour (its earlier minutes have already
// happened), but for a future hour it would understate the full-hour total.
function nowcastCellMm(bucket, isCurrentHour) {
    if (!nowcastFresh(nowcastState) || !nowcastHasPeaks(bucket)) return null;
    if ((bucket.covered_min || 0) >= HOUR_COVER_MIN || isCurrentHour) return bucket.mm || 0;
    return null;
}
function nowcastIntensityCode(mmh) {
    if (mmh >= 20) return 95;     // grmljavina / vrlo jako
    if (mmh >= 7.6) return 82;    // jaki pljuskovi
    if (mmh >= 2.5) return 63;    // kiša
    return 61;                    // slaba kiša
}
const STRONG_NEARBY_MMH = 25;     // a nearby cell (disc-max) at/above this -> thunderstorm icon
// What DGMR says is falling AT THIS MOMENT: the series sample at the forecast's
// current age (base -> wall clock), i.e. the last lead already reached, falling
// back to the base ('now') frame while the age is below the first lead. This is
// the CURRENT hour's icon signal — NOT the hour's peak, which may still be 40
// minutes away while it is sunny outside. null = nowcast missing/stale.
function nowcastNowRate(ns) {
    if (!nowcastFresh(ns)) return null;
    const age = (Date.now() - ns.base_epoch_ms) / 60000;
    let pt = (ns.now && ns.now.point_mmh) || 0;
    let dc = (ns.now && ns.now.disc_max_mmh) || 0;
    for (const s of (ns.series || [])) {
        if (s.lead_min > age) break;               // series ascends in lead
        pt = s.point_mmh || 0; dc = s.disc_max_mmh || 0;
    }
    return { pt, dc };
}
// IMMINENT rain: DGMR says rain is falling at Budva RIGHT NOW while SKALA RAIN
// hasn't caught it yet -> force the rain icon for the CURRENT hour (both the
// hourly cell and the big 'now' icon). Never fires before the onset actually
// arrives — the icon must not turn to rain while it is still dry outside.
function nowcastImminent() {
    const r = nowcastNowRate(nowcastState);
    return !!r && r.pt >= 0.2 && !(radarState && radarState.rainAtLocation);
}
function nowcastImminentCode() {
    const r = nowcastNowRate(nowcastState);
    return nowcastIntensityCode(r ? r.pt : 0);
}

function isRainCode(c) { return c >= 51 && c <= 82; }  // drizzle/rain/showers; thunder 95-99 excluded
function cloudToCode(cc) {
    if (cc == null || isNaN(cc)) return 2;
    if (cc < 10) return 0;
    if (cc < 40) return 1;
    if (cc < 75) return 2;
    return 3;
}
// Nudge the cloudiness icon up ONE step when there is rain in the REGION around
// Budva but not at Budva itself: clear/mostly-clear -> partly cloudy, partly cloudy
// -> overcast. Rain/thunderstorm codes are already heavier, so they are kept.
function escalateCloud(code) {
    if (isRainCode(code) || code >= 95) return code;
    if (code <= 1) return 2;     // vedro / pretežno vedro -> djelimično oblačno
    if (code === 2) return 3;    // djelimično oblačno -> oblačno
    return code;                 // već oblačno (3) / magla -> ostaje isto
}
function radarFresh(rs) { return !!(rs && rs.ok && rs.ageMin != null && rs.ageMin <= 40); }

// Storm severity rank of a WMO code (higher = worse) — lets the radar UPGRADE a
// light model code without ever downgrading a heavier one.
function wcSeverity(c) {
    if (c == null || isNaN(c)) return 0;
    if (c >= 95) return 5;                                  // grmljavina
    const m = { 51:2, 61:2, 53:3, 63:3, 80:3, 81:3, 55:4, 65:4, 82:4 };
    return m[c] || 0;                                       // non-rain -> 0
}

// Map the radar's measured intensity to a WMO code: SEVERE/hail -> thunderstorm,
// otherwise the local closest-wet-pixel dBZ -> light/moderate/heavy rain.
function radarIntensityCode(rs) {
    if (rs.severe || (rs.threat && rs.threat.dbz != null && rs.threat.dbz >= 55)) return 95;
    const dbz = (rs.bestRain && rs.bestRain.dbz != null) ? rs.bestRain.dbz : null;
    if (dbz == null) return 61;       // confirmed rain, intensity unknown -> light
    if (dbz >= 45) return 82;         // Jaki pljuskovi
    if (dbz >= 35) return 63;         // Kiša
    return 61;                        // Slaba kiša
}

// Reconcile a model weather code with SKALA for one clock hour, given that hour's
// nowcast bucket (null = beyond the horizon). SKALA NOWCAST (the DGMR forecast)
// drives this; SKALA RAIN is the fallback and, being current-state ONLY now, gates
// just the current clock hour ("is it raining right now").
function gateWeatherCode(code, cloud, bucket, isCurrentHour, rs) {
    // 1) SKALA NOWCAST — the forecast source. A bucket without peaks says nothing about
    // rain, so it is skipped entirely (and nowcastCellMm leaves its mm alone to match).
    if (nowcastHasPeaks(bucket) && nowcastFresh(nowcastState)) {
        // The CURRENT hour's icon means "now", so it reads the rate at this moment —
        // rain due later in the same clock hour must not paint it while it is still
        // dry/sunny. Future hours describe their whole hour, so they read the peaks.
        const nowr = isCurrentHour ? nowcastNowRate(nowcastState) : null;
        const pt = nowr ? nowr.pt : bucket.peak_point_mmh;   // rain AT Budva
        const dc = nowr ? nowr.dc : bucket.peak_disc_mmh;    // rain in the ~8 km region
        if (pt >= 0.2) {                                     // raining AT Budva -> rain icon (point intensity)
            const rc = nowcastIntensityCode(pt);
            return wcSeverity(code) >= wcSeverity(rc) ? code : rc;
        }
        if (dc >= 0.2) {                                     // dry at Budva, but a cell is NEARBY:
            if (dc >= STRONG_NEARBY_MMH)                     //   strong cell -> thunderstorm
                return wcSeverity(code) >= 5 ? code : 95;
            // Weaker -> just nudge cloudiness one step. escalateCloud keeps rain codes,
            // which is right for a future hour (rain lands within it), but the CURRENT
            // hour's icon means NOW and it is dry at Budva at this moment — strip the
            // model's rain code before the nudge.
            return escalateCloud(isCurrentHour && isRainCode(code) ? cloudToCode(cloud) : code);
        }
        // Nothing near Budva. The nowcast may always UPGRADE (it sees rain the model
        // missed), but it may only CONTRADICT the model over an hour it really covers;
        // for the current hour "dry at this very moment" is already the full statement.
        if (isCurrentHour || (bucket.covered_min || 0) >= HOUR_COVER_MIN)
            return isRainCode(code) ? cloudToCode(cloud) : code;
        return code;
    }
    // 2) Fallback: SKALA RAIN, current state ONLY.
    if (isCurrentHour && radarFresh(rs)) {
        if (rs.rainAtLocation) {
            const rc = radarIntensityCode(rs);
            return wcSeverity(code) >= wcSeverity(rc) ? code : rc;
        }
        return isRainCode(code) ? cloudToCode(cloud) : code;
    }
    return code;
}

// Near-term gate: SKALA NOWCAST (DGMR) primary, SKALA RAIN fallback. (SKALA CLOUD
// was removed from forecast.html earlier — its frames ran stale/misleading; the
// SKALA CLOUD page itself still lives in the budva-radar repo.)
function gatedCode(code, cloud, datetime, isCurrentHour) {
    return gateWeatherCode(code, cloud, nowcastHour(nowcastState, datetime), isCurrentHour, radarState);
}

// "Is this cell the current clock hour" by the wall clock. render() runs once and
// stamps the current hour then; after a rollover that stamp points at the PREVIOUS
// hour, and the new hour's cell would be gated as a future one — keeping the model's
// rain icon while it is still dry outside.
function cellIsCurrentHour(datetime) {
    const t = Date.parse(datetime);
    return !isNaN(t) && Date.now() - t >= 0 && Date.now() - t < 3600000;
}

// Re-skin the current-weather icon + every hourly cell the nowcast horizon covers.
function applyRadarGating() {
    const imminent = nowcastImminent();
    const imminentCode = imminent ? nowcastImminentCode() : null;
    const box = document.getElementById('cwIconBox');
    if (box) {
        const code = +box.dataset.code;
        const cloud = box.dataset.cloud === '' ? null : +box.dataset.cloud;
        const hour = +box.dataset.hour;
        let code0 = gatedCode(code, cloud, box.dataset.datetime, true);
        if (imminent && wcSeverity(code0) === 0) code0 = imminentCode;  // DGMR: raining NOW -> force rain
        box.innerHTML = weatherIcon(getWeatherIcon(code0, hour), 96);
    }
    document.querySelectorAll('.hourly-cell[data-code]').forEach(cell => {
        const isNow = cellIsCurrentHour(cell.dataset.datetime);
        cell.classList.toggle('is-now', isNow);
        const hour = +cell.dataset.hour;
        const code = +cell.dataset.code;
        const cloud = cell.dataset.cloud === '' ? null : +cell.dataset.cloud;
        const bucket = nowcastHour(nowcastState, cell.dataset.datetime);
        const iconEl = cell.querySelector('.h-icon');
        let cellCode = gateWeatherCode(code, cloud, bucket, isNow, radarState);
        if (imminent && isNow && wcSeverity(cellCode) === 0) cellCode = imminentCode;  // raining NOW -> force rain
        if (iconEl) iconEl.innerHTML = weatherIcon(getWeatherIcon(cellCode, hour), 48);
        // SKALA NOWCAST mm override: over its ~80 min horizon the DGMR forecast is more
        // accurate than the NWP precipitation, so replace the mm of the hours it covers.
        const rainEl = cell.querySelector('.h-rain');
        const mm = nowcastCellMm(bucket, isNow);
        if (rainEl && mm != null) {
            rainEl.textContent = mm > 0.05 ? mm.toFixed(1) + 'mm' : '';
            rainEl.style.color = '#0366d6';
            rainEl.title = 'SKALA NOWCAST (DGMR) — kiša u ovom satu (pokriveno ' +
                           (bucket.covered_min || 0) + ' od 60 min)';
        } else if (rainEl) {
            // render() runs once, this every 120 s: a cell overridden earlier can fall out
            // of the horizon as the base advances, so put the NWP mm back instead of
            // leaving a stale nowcast number (and its "pokriveno N od 60 min" tooltip).
            const nwp = parseFloat(cell.dataset.mm);
            rainEl.textContent = nwp > 0.05 ? nwp.toFixed(1) + 'mm' : '';
            rainEl.style.color = '';
            rainEl.removeAttribute('title');
        }
    });
}

const DOUGLAS_DEGREE_BY_LABEL = {
    'Bonaca': 0, 'Mirno': 1, 'Blagi talasi': 2, 'Umjereni talasi': 3,
    'Talasasto': 4, 'Vrlo talasasto': 5, 'Uzburkano': 6,
    'Vrlo uzburkano': 7, 'Olujni talasi': 8, 'Izuzetno olujni talasi': 9,
};

const DOUGLAS_LABEL_BY_DEGREE = ['Bonaca', 'Mirno', 'Blagi talasi', 'Umjereni talasi',
    'Talasasto', 'Vrlo talasasto', 'Uzburkano', 'Vrlo uzburkano',
    'Olujni talasi', 'Izuzetno olujni talasi'];

// Mirror of forecast_48h_v3.adriatic_sea_state, recomputed client-side so the
// direction cap applies even while the JSON is a few hours stale.
// Bečići: only jugo (E-SE-S) has open-sea fetch; bura (NE) makes short, sharp
// chop that stays small; N and W directions come off the land, so a "wave"
// from there is a 5.5 km-grid artifact and never rates above "Blagi talasi".
function seaStateDirectionCap(deg) {
    if (deg == null || isNaN(deg)) return 9;
    const d = ((deg % 360) + 360) % 360;
    if (d < 22.5) return 2;    // N: off the land
    if (d < 90) return 4;      // NE (bura): short chop
    if (d < 240) return 9;     // E-SE-S-SW (jugo fetch): full scale
    return 2;                  // W-NW-N: off the land
}

// Upper bounds of Douglas states 1..8, mirroring _DOUGLAS_THRESHOLDS.
const DOUGLAS_THRESHOLDS = [0.1, 0.5, 1.25, 2.5, 4.0, 6.0, 9.0, 14.0];

function adriaticSeaState(heightM, dirDeg) {
    if (heightM == null || isNaN(heightM)) return null;
    let s = 9;
    if (heightM < 0.05) {
        s = 0;
    } else {
        for (let i = 0; i < DOUGLAS_THRESHOLDS.length; i++) {
            if (heightM < DOUGLAS_THRESHOLDS[i]) { s = i + 1; break; }
        }
    }
    return Math.min(s, seaStateDirectionCap(dirDeg));
}

// Mirror of forecast_48h_v3.direction_capped_height: the height clipped to
// what this bearing can actually deliver at Bečići.
function directionCappedHeight(heightM, dirDeg) {
    if (heightM == null || isNaN(heightM)) return null;
    const cap = seaStateDirectionCap(dirDeg);
    if (cap - 1 < DOUGLAS_THRESHOLDS.length) {
        return Math.min(heightM, DOUGLAS_THRESHOLDS[cap - 1]);
    }
    return heightM;
}

function seaStateLabel(heightM, dirDeg, fallbackLabel) {
    const deg = adriaticSeaState(heightM, dirDeg);
    return deg != null ? DOUGLAS_LABEL_BY_DEGREE[deg] : (fallbackLabel || '');
}

// Mirror of forecast_48h_v3.sailing_score — the strict Bečići criteria,
// recomputed client-side so a stale JSON can't show the old lenient scores.
// "Oprez"/"Opasno" need either a southern sea (jugo-sirocco-lebić, the only
// sector with fetch to Bečići) or real gusts. A tall wave out of the W or N
// is the same grid artifact seaStateDirectionCap already flattens, so it
// cannot raise a warning on its own.
const MS_PER_KNOT = 0.514444;
const SAILING_RANK = ['Idealno', 'Dobro', 'Prihvatljivo', 'Oprez', 'Opasno'];
const SAILING_COLOR = {
    'Idealno': 'green', 'Dobro': 'green', 'Prihvatljivo': 'yellow',
    'Oprez': 'orange', 'Opasno': 'red'
};

// Unknown direction counts as southern, so a missing field can't mute a warning.
function isSouthernDirection(deg) {
    if (deg == null || isNaN(deg)) return true;
    const d = ((deg % 360) + 360) % 360;
    return d >= 112.5 && d < 247.5;
}

function sailingScore(bft, waveHeight, waveDir, windDir, windGustsMs) {
    if (bft == null || waveHeight == null) return { color: 'gray', label: 'N/A' };

    // Use the direction-capped height, the same number the Douglas pill on
    // this card shows. Otherwise a 1 m "wave" out of the W reads "Blagi
    // talasi" and docks the day a rung in the same breath.
    const effHeight = directionCappedHeight(waveHeight, waveDir);

    let label;
    if (bft <= 2 && effHeight <= 0.3) label = 'Idealno';
    else if (bft <= 3 && effHeight <= 0.6) label = 'Dobro';
    else label = 'Prihvatljivo';

    const worst = (other) => {
        if (SAILING_RANK.indexOf(other) > SAILING_RANK.indexOf(label)) label = other;
    };

    if (isSouthernDirection(waveDir)) {
        // A southern wind of 3 Bft+ is still building the sea: lower the bar.
        const windKnown = windDir != null && !isNaN(windDir);
        const building = windKnown && isSouthernDirection(windDir) && bft >= 3;
        const oprezAt = building ? 0.8 : 1.0;
        const opasnoAt = building ? 1.5 : 1.8;
        if (waveHeight >= opasnoAt) worst('Opasno');
        else if (waveHeight >= oprezAt) worst('Oprez');
    }

    // Gusts judged on their own terms, in knots. For daily cards the caller
    // passes wind_gusts_persistent (the level held 4+ daytime hours), never
    // the raw peak, so a single gusty hour can't cost the day a rung.
    if (windGustsMs != null && !isNaN(windGustsMs)) {
        const gustKn = windGustsMs / MS_PER_KNOT;
        if (gustKn > 34) worst('Opasno');
        else if (gustKn > 22) worst('Oprez');
        else if (gustKn > 15) worst('Prihvatljivo');
    }

    return { color: SAILING_COLOR[label], label: label };
}

function douglasPill(label) {
    if (!label) return '';
    const deg = DOUGLAS_DEGREE_BY_LABEL[label];
    if (deg == null) return '';
    const bucket = Math.min(Math.max(deg - 1, 0), 7);
    return `<span class="d-deg d-deg-sm d-${bucket}">${deg}</span>`;
}

function precipProbStyle(pp) {

            'Svježe jutro, ugodnije prepodne, prohladno ponovo od kasnog popodneva',
            'Jutro hladno, ali popodne prijatnije — uveče ponijeti jaknu',
            'Temperatura raste od svježeg jutra, ali uveče opet pada — slojevi preporučeni'
        );
    }

    if (pool.length === 0) return d.day_narrative || '';
    const hash = (d.date||'').split('').reduce((a,c) => a + c.charCodeAt(0), 0);
    let text = pool[hash % pool.length];

    // Rain in the data must reach the report even when the sky pool picked a
    // dry sentence — a 2-hour shower still gets its note.
    if ((pt > 0.2 || (d.rain_hours != null && d.rain_hours >= 1))
            && !/kiš|pljus|padavin|grmljav|nevrijeme|snij/i.test(text)) {
        text += `. Povremena kiša${pt >= 1 ? ` (${pt.toFixed(1)} mm)` : ''}`;
    }

    if (w >= 14) {
        const wn = ['. Olujni vjetar','. Izuzetno vjetrovito, mogući šteta od udara','. Jak i opasan vjetar cijelim danom'];
        text += wn[hash % wn.length];
    } else if (w >= 8) {
        const wn = ['. Jak vjetar','. Vjetrovito cijelim danom','. Pojačan vjetar, mogući udari','. Vjetar pojačava tokom dana'];
        text += wn[hash % wn.length];
    } else if (w >= 4 && ['clear','mostly_clear','partly_cloudy'].includes(icon)) {
        const mw = [', uz umjeren vjetar',', blagi vjetar sa mora',', lagani povjetarac'];
        text += mw[hash % mw.length];
    }

    return text;
}

function maeToAccuracy(param, mae) {
    const ranges = {
        temperature_2m: 35,         
        wind_speed_10m: 15,         
        pressure_msl: 40,           
        relative_humidity_2m: 100,  
        precipitation: 10,          
        cloud_cover: 100,           
        dew_point_2m: 30,           
        wind_gusts_10m: 25,         
        shortwave_radiation: 800,   
    };
    const range = ranges[param] || 30;
    return Math.max(0, Math.min(100, (1 - mae / range) * 100));
}

let currentChart = null;
let forecastData = null;
let currentUv = null;          // live UV index (Open-Meteo); shown in the card only when > 7
let uvByHour = {};             // "YYYY-MM-DDTHH" (local) -> uv_index, for the hourly strip

// Beach-level wind amplification estimate based on direction.
// Open-Meteo's coastal grid cells smooth over land+sea; right at the waterline,
// directional effects produce noticeably stronger gusts than the model predicts.
// Returns null when no amplification applies.
function beachWindAdjustment(directionDeg) {
    if (directionDeg == null || isNaN(directionDeg)) return null;
    const d = ((directionDeg % 360) + 360) % 360;
    // Jugo sector: S ± 45° (135-225°). Onshore wind from open sea, no friction.
    if (d >= 135 && d <= 225) {
        return { factor: 1.4, label: 'jugo',
                 hint: 'Jugo sa mora — na plaži udari osjetno jači, more može biti uzburkano.' };
    }
    // Bura sector: NE-ENE (10-70°). Katabatic downwash from Lovćen, gusty at coast.
    if (d >= 10 && d <= 70) {
        return { factor: 1.25, label: 'bura',
                 hint: 'Bura silazna sa Lovćena — na obali grublja, more može odnositi prema pučini.' };
    }
    return null;
}

// ---------- Weather warnings ----------
// Inspects 48h hourly_forecast and returns warning objects covering wind,
// thunderstorms, heavy rain, and microcellular short bursts (1-2h isolated).
// Each warning: {kind, sev, title, time, details, active, startIdx, endIdx}.
function computeWarnings(hourly, currentHour, currentDate) {
    if (!hourly || hourly.length === 0) return [];

    function findRuns(pred) {
        const runs = []; let i = 0;
        while (i < hourly.length) {
            if (pred(hourly[i])) {
                let j = i;
                while (j < hourly.length && pred(hourly[j])) j++;
                runs.push({ start: i, end: j - 1 });
                i = j;
            } else i++;
        }
        return runs;
    }

    // Local YYYY-MM-DD. NEVER use toISOString() here: it converts to UTC, and
    // for a positive-offset TZ (Budva is UTC+1/+2) local midnight falls on the
    // PREVIOUS UTC day, which shifted every day label back by one (tomorrow's
    // warning was labelled "preksjutra").
    function ymdLocal(d) {
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    function dayPrefix(dateStr) {
        if (!dateStr || dateStr === currentDate) return '';
        const base = new Date(currentDate + 'T00:00');
        base.setDate(base.getDate() + 1);
        const tom = ymdLocal(base);
        if (dateStr === tom) return 'sjutra ';
        base.setDate(base.getDate() + 1);
        const dayAfter = ymdLocal(base);
        if (dateStr === dayAfter) return 'preksjutra ';
        return new Date(dateStr + 'T00:00').toLocaleDateString('sr-Latn', { weekday: 'short' }) + ' ';
    }

    function fmtSpan(startIdx, endIdx) {
        const s = hourly[startIdx], e = hourly[endIdx];
        const sDate = (s.datetime || '').slice(0, 10);
        let eDate = (e.datetime || '').slice(0, 10);
        const sH = String(s.hour).padStart(2, '0') + ':00';
        const eHourEnd = (e.hour + 1) % 24;
        const eH = String(eHourEnd).padStart(2, '0') + ':00';
        // If last warning hour is 23:00, end-of-window (24:00) is next day's 00:00.
        if (e.hour === 23 && eHourEnd === 0 && eDate) {
            const d = new Date(eDate + 'T00:00');
            d.setDate(d.getDate() + 1);
            eDate = ymdLocal(d);
        }
        const sTag = dayPrefix(sDate);
        const eTag = dayPrefix(eDate);
        if (sTag === eTag) return `${sTag}${sH} — ${eH}`;
        return `${sTag}${sH} — ${eTag}${eH}`;
    }

    function isCovered(startIdx, endIdx) {
        for (let k = startIdx; k <= endIdx; k++) {
            const h = hourly[k];
            if (h.hour === currentHour && (h.datetime || '').slice(0, 10) === currentDate) return true;
        }
        return false;
    }

    // Index of "now" in the hourly array; used to flag warnings whose span
    // falls within the next 3h (active counts too). Imminent + threshold ->
    // severity escalates to extreme so the row renders red.
    const currentIdx = hourly.findIndex(h =>
        h.hour === currentHour && (h.datetime || '').slice(0, 10) === currentDate
    );
    function isImminent(startIdx, endIdx) {
        if (currentIdx < 0) return false;
        return startIdx <= currentIdx + 3 && endIdx >= currentIdx;
    }

    const warnings = [];
    const tsPred = h => [95, 96, 99].includes(h.weather_code);
    const heavyPred = h => (h.precipitation || 0) >= 5;

    // --- Wind ---
    const windPred = h => (h.wind_gusts_10m >= 17) || (h.wind_speed_10m >= 14);
    findRuns(windPred).forEach(r => {
        const slice = hourly.slice(r.start, r.end + 1);
        const maxGust = Math.max(...slice.map(h => h.wind_gusts_10m || 0));
        const maxWind = Math.max(...slice.map(h => h.wind_speed_10m || 0));
        // Representative direction = direction at the hour of peak gust.
        let domDir = null, peakGust = -1;
        slice.forEach(h => {
            const g = h.wind_gusts_10m || 0;
            if (g > peakGust) { peakGust = g; domDir = h.wind_direction_10m; }
        });
        const beach = beachWindAdjustment(domDir);

        let sev = 'moderate', title = 'Jak vjetar';
        if (maxGust >= 28) { sev = 'extreme'; title = 'Orkanski vjetar'; }
        else if (maxGust >= 22 || maxWind >= 18) { sev = 'severe'; title = 'Olujni vjetar'; }
        // Imminent (next 3h) + gusts >= 17 -> escalate to red.
        if (sev !== 'extreme' && maxGust >= 17 && isImminent(r.start, r.end)) {
            sev = 'extreme';
        }

        let details = `Udari do ${maxGust.toFixed(0)} m/s, vjetar do ${maxWind.toFixed(0)} m/s`;
        if (beach) {
            const beachGust = Math.round(maxGust * beach.factor);
            details += `. Smjer ${beach.label} — na plaži udari moguće do ~${beachGust} m/s.`;
        }
        warnings.push({
            kind: 'wind', sev, title,
            time: fmtSpan(r.start, r.end),
            details,
            active: isCovered(r.start, r.end),
            startIdx: r.start, endIdx: r.end,
        });
    });

    // --- Thunderstorm ---
    findRuns(tsPred).forEach(r => {
        const slice = hourly.slice(r.start, r.end + 1);
        const maxRain = Math.max(...slice.map(h => h.precipitation || 0));
        const maxGust = Math.max(...slice.map(h => h.wind_gusts_10m || 0));
        warnings.push({
            kind: 'thunder', sev: 'extreme', title: 'Grmljavina',
            time: fmtSpan(r.start, r.end),
            details: `Maks. kiša ${maxRain.toFixed(1)} mm/h, udari do ${maxGust.toFixed(0)} m/s`,
            active: isCovered(r.start, r.end),
            startIdx: r.start, endIdx: r.end,
        });
    });

    // No hail warning. It used to fire on hail_models >= 1, which reads like
    // a 1-of-10 consensus but isn't: of the ten models, only ICON_SEAMLESS
    // ever emits WMO 96/99 at all (84 hours in 50,586; the other nine emit it
    // zero times, ever). So the gate was really "ICON said hail", and it fired
    // on convective days the rest of the ensemble had nothing to say about --
    // e.g. 2026-07-24 09-10h, flagged while the same hours read "Pretezno
    // vedro", 34% cloud, and 0.0 mm at the 95th percentile. hail_models is
    // still published in the JSON as raw data; nothing in the UI reads it.

    // --- Heavy rain (3h sum gate) ---
    // Trigger only when next 3h cumulative precipitation > 6 mm. This
    // catches stacked moderate hours (e.g. 3+3+2) that any-single-hour
    // thresholds miss, and keeps the warning panel focused on near-term
    // actionable rainfall.
    if (currentIdx >= 0) {
        const endIdx3h = Math.min(hourly.length - 1, currentIdx + 2);
        const slice3h = hourly.slice(currentIdx, endIdx3h + 1);
        const sum3h = slice3h.reduce((s, h) => s + (h.precipitation || 0), 0);
        if (sum3h > 6) {
            const maxRain = Math.max(...slice3h.map(h => h.precipitation || 0));
            warnings.push({
                kind: 'rainHeavy', sev: 'extreme', title: 'Obilna kiša',
                time: fmtSpan(currentIdx, endIdx3h),
                details: `Suma ${sum3h.toFixed(1)} mm u narednih 3h, maks. ${maxRain.toFixed(1)} mm/h`,
                active: true,
                startIdx: currentIdx, endIdx: endIdx3h,
            });
        }
    }

    // --- Short-burst showers (microcellular convection signature) ---
    // Wet runs of 1-2 hours, NOT overlapping thunderstorm or heavy-rain runs
    // (those are handled above and would be misleading to also flag as "burst").
    const wetPred = h => (h.precipitation || 0) >= 0.2;
    findRuns(wetPred).forEach(r => {
        const len = r.end - r.start + 1;
        if (len > 2) return;
        const slice = hourly.slice(r.start, r.end + 1);
        if (slice.some(tsPred) || slice.some(heavyPred)) return;
        const totalRain = slice.reduce((s, h) => s + (h.precipitation || 0), 0);
        const maxGust = Math.max(...slice.map(h => h.wind_gusts_10m || 0));
        // Direction at peak gust hour drives beach amplification (same rule
        // as wind warnings). Showers carry downdraft gusts whose direction
        // matters as much as raw magnitude on the beach.
        let domDir = null, peakGust = -1;
        slice.forEach(h => {
            const g = h.wind_gusts_10m || 0;
            if (g > peakGust) { peakGust = g; domDir = h.wind_direction_10m; }
        });
        const beach = beachWindAdjustment(domDir);
        const lenTxt = len === 1 ? '1 sat' : len + ' sata';
        let details = `${lenTxt}, ~${totalRain.toFixed(1)} mm, udari do ${maxGust.toFixed(0)} m/s`;
        if (beach) {
            const beachGust = Math.round(maxGust * beach.factor);
            // Skip beach line when amplified value is still trivially small;
            // adds noise without info. Same threshold as current-weather hint.
            if (beachGust >= 8) {
                details += `. Na plaži udari moguće do ~${beachGust} m/s (${beach.label}).`;
            }
        }
        // Imminent micro-cell with stout gusts -> red. Slabi pljuskovi
        // (gust < 12) ostaju amber.
        let showerSev = 'moderate';
        if (maxGust >= 12 && isImminent(r.start, r.end)) {
            showerSev = 'extreme';
        }
        warnings.push({
            kind: 'shower', sev: showerSev, title: 'Kratki pljusak',
            time: fmtSpan(r.start, r.end),
            details,
            active: isCovered(r.start, r.end),
            startIdx: r.start, endIdx: r.end,
        });
    });

    // Sort: active first, then by severity (extreme > severe > moderate), then time.
    const sevOrder = { extreme: 0, severe: 1, moderate: 2 };
    warnings.sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        if (sevOrder[a.sev] !== sevOrder[b.sev]) return sevOrder[a.sev] - sevOrder[b.sev];
        return a.startIdx - b.startIdx;
    });

    // Showers across 48h become noisy; only show the one happening NOW or
    // imminent within the next 3h. Bursts further out are too uncertain to
    // act on — but a 3h horizon is short enough to be actionable, so the
    // imminent + red-severity escalation is allowed through.
    let showerKept = false;
    const filtered = warnings.filter(w => {
        if (w.kind !== 'shower') return true;
        const keep = w.active || isImminent(w.startIdx, w.endIdx);
        if (keep && !showerKept) { showerKept = true; return true; }
        return false;
    });

    return filtered;
}

function warningIcon(kind) {
    const ICONS = {
        wind:      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>',
        rainHeavy: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25M8 19v2M8 13v2M12 21v2M12 15v2M16 19v2M16 13v2"/></svg>',
        shower:    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25M16 14l-2 4M9 14l-2 4"/></svg>',
        thunder:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9M13 11l-4 6h6l-4 6"/></svg>',
    };
    return ICONS[kind] || ICONS.wind;
}

async function loadForecast() {
    try {
        const resp = await fetch('forecast_data/forecast_48h.json?v=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        forecastData = await resp.json();
        // Populate radar + satellite state before first paint so near-term icons
        // are gated immediately. Cap the wait so a slow source never blocks render.
        await Promise.race([refreshRadar(),
                            new Promise(r => setTimeout(r, 2500))]);
        render(forecastData);
        renderStatusLine();
        applyRadarGating();
        fetchUv();                       // async; reveals the UV row only when UV > 7
    } catch(e) {
        document.getElementById('app').innerHTML =
            '<div class="loading" style="color:#d73a49">Greška: ' + e.message +
            '<br><small>Pokrenite forecast_48h_v3.py za generisanje prognoze</small></div>';
    }
}

function render(data) {
    const gen = new Date(data.generated);
    document.getElementById('genTime').textContent =
        'Generisano: ' + gen.toLocaleDateString('sr-Latn') + ' u ' +
        gen.toLocaleTimeString('sr-Latn', {hour:'2-digit',minute:'2-digit'});

    let html = '';

    // Build date -> SST lookup from marine_forecast.waves.daily_summary
    const sstByDate = {};
    if (data.marine_forecast && data.marine_forecast.waves && data.marine_forecast.waves.daily_summary) {
        data.marine_forecast.waves.daily_summary.forEach(m => {
            if (m.date && m.sst_avg != null) sstByDate[m.date] = m.sst_avg;
        });
    }

    html += '<div class="daily-grid">';
    data.daily_summary.forEach(d => {
        const condition = dailyCondition(d);
        const dayName = DAY_NAMES_SR[d.day_name] || d.day_name;
        const iconKey = dailyIconKey(condition.icon);
        const icon = weatherIcon(iconKey, 56);
        const wdText = d.wind_dir_avg != null ? ' ' + windArrow(d.wind_dir_avg) + ' ' + windDirText(d.wind_dir_avg) : '';
        html += `
        <div class="day-card">
            <div class="day-header">
                <div>
                    <div class="day-name">${dayName}</div>
                    <div class="day-date">${formatDate(d.date)}</div>
                </div>
            </div>
            <div class="day-condition">
                ${icon}
                <div class="weather-desc">${condition.description}</div>
            </div>
            <div class="day-narrative">${d.day_narrative || generateNarrative(d, condition.icon)}</div>
            <div class="temp-range">
                <span class="temp-low">${d.temp_min.toFixed(1)}°</span>
                <span style="color:#d1d5db">—</span>
                <span class="temp-high">${d.temp_max.toFixed(1)}°</span>
            </div>

            <div class="day-details">
                <div class="detail-item"><span class="detail-label">Vjetar</span><span class="detail-val">${d.wind_max} m/s${wdText}</span></div>
                <div class="detail-item"><span class="detail-label">Padavine</span><span class="detail-val">${d.precip_total != null ? d.precip_total + ' mm' : 'N/A'}${d.rain_hours >= 1 ? ' · ~' + d.rain_hours + ' h' : ''}</span></div>
                <div class="detail-item"><span class="detail-label">Vlažnost</span><span class="detail-val">${d.humidity_avg}%</span></div>
                <div class="detail-item"><span class="detail-label">Pritisak</span><span class="detail-val">${d.pressure_avg} hPa</span></div>
                ${sstByDate[d.date] != null ? '<div class="detail-item"><span class="detail-label">More</span><span class="detail-val">' + sstByDate[d.date].toFixed(1) + '°C</span></div>' : ''}
            </div>
        </div>`;
    });
    html += '</div>';

    const now = new Date();
    const currentHour = now.getHours();
    const currentData = data.hourly_forecast.find(h => h.hour === currentHour) || data.hourly_forecast[0];
    const currentIdx = data.hourly_forecast.indexOf(currentData);
    if (currentData) {
        const wmoDescs = {0:'Vedro',1:'Pretežno vedro',2:'Djelimično oblačno',3:'Oblačno',45:'Magla',48:'Magla',51:'Sitna kiša',53:'Sitna kiša, umjerena',55:'Sitna kiša, jaka',61:'Slaba kiša',63:'Kiša',65:'Jaka kiša',71:'Snijeg',73:'Snijeg',75:'Jak snijeg',80:'Pljuskovi',81:'Pljuskovi',82:'Jaki pljuskovi',95:'Grmljavina',96:'Grmljavina',99:'Grmljavina'};
        // SKALA gate: the near-term icon must agree with the radar (rain) and the
        // satellite (sky) — see gatedCode().
        const cwCode = gatedCode(currentData.weather_code, currentData.cloud_cover, currentData.datetime, true);
        const cwIcon = getWeatherIcon(cwCode, currentData.hour);
        const cwDesc = wmoDescs[cwCode] || 'Vedro';
        const gatedDryNow = isRainCode(currentData.weather_code) && !isRainCode(cwCode);

        // Compute warnings against the full 48h horizon. Active = covers current hour.
        const currentDate = (currentData.datetime || '').slice(0, 10);
        const warnings = computeWarnings(data.hourly_forecast, currentHour, currentDate);
        const activeWarnings = warnings.filter(w => w.active);
        const topSev = activeWarnings.length > 0 ? activeWarnings[0].sev : null;
        const cwClass = topSev ? `current-weather has-warning-${topSev}` : 'current-weather';

        if (warnings.length > 0) {
            html += '<div class="weather-warnings">';
            warnings.forEach(w => {
                const badgeLabels = { wind: 'Moguće', rainHeavy: 'Moguće', shower: 'Moguće', thunder: 'Upozorenje' };
                const badge = w.active ? '<span class="w-now-badge">' + (badgeLabels[w.kind] || 'Upozorenje') + '</span>' : '';
                html += `
                <div class="warning-row sev-${w.sev}">
                    <div class="w-icon">${warningIcon(w.kind)}</div>
                    <div class="w-text">
                        <div class="w-title">${w.title}${badge}</div>
                        <div class="w-time">${w.time}</div>
                        <div class="w-details">${w.details}</div>
                    </div>
                </div>`;
            });
            html += '</div>';
        }

        html += `
        <div class="${cwClass}">
            <div class="cw-icon" id="cwIconBox" data-code="${currentData.weather_code}" data-cloud="${currentData.cloud_cover != null ? currentData.cloud_cover : ''}" data-hour="${currentData.hour}" data-datetime="${currentData.datetime || ''}">${weatherIcon(cwIcon, 96)}</div>
            <div class="cw-main">
                <div class="cw-label">${String(currentHour).padStart(2,'0')}:00h</div>
                <div class="cw-temp">${currentData.temperature_2m.toFixed(1)}°C</div>
                <div class="cw-desc">${cwDesc}</div>
                <div class="cw-details">
                    <div class="cw-detail">${weatherIcon('wind', 20)} <span>${windArrow(currentData.wind_direction_10m)} ${currentData.wind_speed_10m.toFixed(1)} m/s ${windDirText(currentData.wind_direction_10m)}</span></div>
                    <div class="cw-detail">${weatherIcon('humidity', 20)} <span>${Math.round(currentData.relative_humidity_2m)}%</span></div>
                    <div class="cw-detail"><img src="${ICON_CDN}barometer.svg" width="20" height="20" style="vertical-align:middle"> <span>${currentData.pressure_msl.toFixed(0)} hPa</span></div>
                    ${currentData.precipitation > 0.05 && !gatedDryNow ? '<div class="cw-detail">' + weatherIcon('rain_icon', 20) + ' <span>' + currentData.precipitation.toFixed(1) + ' mm</span></div>' : ''}
                    ${(function() {
                        const beach = beachWindAdjustment(currentData.wind_direction_10m);
                        if (!beach) return '';
                        const gust = currentData.wind_gusts_10m || (currentData.wind_speed_10m * 1.5);
                        const beachGust = Math.round(gust * beach.factor);
                        if (beachGust < 8) return '';
                        return `<div class="cw-detail" title="${beach.hint}">${weatherIcon('wind', 20)} <span>Na plaži udari do ~${beachGust} m/s (${beach.label})</span></div>`;
                    })()}
                    <div class="cw-detail" id="cwUvDetail" style="display:none"></div>
                </div>
                <div id="radarStatusLine" class="cw-radar-line" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.08);font-size:14px;color:#555">Radar: ucitavam...</div>
            </div>
        </div>`;
    }

function updateCompass(dir, spd) {
    const cv = document.getElementById('compassCanvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const s = cv.width, cx = s/2, cy = s/2, r = s/2 - 10;
    ctx.clearRect(0, 0, s, s);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = '#d0d7de'; ctx.lineWidth = 1.5; ctx.stroke();
    for (let i = 0; i < 8; i++) {
        const a = i*Math.PI/4, len = i%2===0?6:3;
        ctx.beginPath();
        ctx.moveTo(cx+Math.sin(a)*(r-1), cy-Math.cos(a)*(r-1));
        ctx.lineTo(cx+Math.sin(a)*(r-1-len), cy-Math.cos(a)*(r-1-len));
        ctx.strokeStyle='#959da5'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#24292e';
    ctx.fillText('S',cx,cy-r+13); ctx.fillText('J',cx,cy+r-13);
    ctx.fillStyle='#586069';
    ctx.fillText('I',cx+r-13,cy); ctx.fillText('Z',cx-r+13,cy);
    const fromRad=dir*Math.PI/180, toRad=fromRad+Math.PI, arm=r-16;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.sin(fromRad)*arm*0.35, cy-Math.cos(fromRad)*arm*0.35);
    ctx.strokeStyle='#959da5'; ctx.lineWidth=2; ctx.stroke();
    const tipX=cx+Math.sin(toRad)*arm, tipY=cy-Math.cos(toRad)*arm;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tipX,tipY);
    ctx.strokeStyle='#0366d6'; ctx.lineWidth=2.5; ctx.stroke();
    const ang=Math.atan2(tipY-cy,tipX-cx), hl=8, ha=0.45;
    ctx.beginPath(); ctx.moveTo(tipX,tipY);
    ctx.lineTo(tipX-hl*Math.cos(ang-ha),tipY-hl*Math.sin(ang-ha));
    ctx.lineTo(tipX-hl*Math.cos(ang+ha),tipY-hl*Math.sin(ang+ha));
    ctx.closePath(); ctx.fillStyle='#0366d6'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fillStyle='#24292e'; ctx.fill();
    const lbl=document.getElementById('compassLabel');
    if(lbl) lbl.textContent=windDirText(dir)+' \u00b7 '+(spd!=null?spd.toFixed(1)+' m/s':'');
}

async function fetchRadarData() {

    }

// Parse radar JSON into the compact state used by the status line + icon gating.
function parseRadarState(data) {
    const sum = (data && data.summary) || {};
    const sources = (data && data.sources) || {};
    let bestRain = null;        // closest WET pixel (LOCAL intensity) across sources
    let bestThreat = null;      // worst APPROACHING dominant cell (for SEVERE)
    let srcApproaching = false, srcEta = null, srcAtLoc = false, srcVicinity = false;

    // Closest actual wet pixel of a source (rings) = the LOCAL intensity near
    // Budva. Display this, NOT app.closest_rain_* — the pipeline sets that to the
    // dominant cell's peak max_dbz (storm core, possibly far away), which reads
    // far higher than the true local value. Mirrors SKALA (skala-sections.js).
    const closestWetOf = (info) => {
        let best = null;
        for (const r of (info.rings || [])) {
            if (r.closest_wet_km != null && (!best || r.closest_wet_km < best.km)) {
                best = { km: r.closest_wet_km, cardinal: r.closest_wet_bearing_cardinal, dbz: r.closest_wet_dbz };
            }
        }
        return best;
    };

    for (const [srcId, info] of Object.entries(sources)) {
        if (!info || !info.ok) continue;
        const app = info.approaching;
        if (!app) continue;
        if (app.rain_at_location) srcAtLoc = true;
        if (app.any_rain_within_radii) srcVicinity = true;

        const cw = closestWetOf(info);
        if (cw && cw.km != null && (!bestRain || cw.km < bestRain.km)) {
            bestRain = {
                src: srcId, km: cw.km, cardinal: cw.cardinal, dbz: cw.dbz,
                motionCardinal: app.motion_direction_cardinal || (info.motion && info.motion.direction_cardinal),
            };
        }

        if (app.any_rain_within_radii && app.is_approaching) {
            srcApproaching = true;
            if (app.eta_minutes != null && (srcEta == null || app.eta_minutes < srcEta)) srcEta = app.eta_minutes;
            // Worst approaching dominant cell drives SEVERE — its peak dBZ may be a
            // big cell BEHIND a lighter closest one. Same as SKALA's threat. Bound
            // to the monitored vicinity (150 km = outermost ring): a storm 200 km
            // away is NOT a local severe event. The pipeline doesn't bound it.
            const VICINITY_MAX_KM = 150;
            const nd = app.nowcast_details && app.nowcast_details.dominant;
            const cand = (nd && nd.dist_km != null && nd.dist_km <= VICINITY_MAX_KM)
                ? { dbz: nd.max_dbz, km: nd.dist_km, cardinal: nd.bearing_cardinal, eta: nd.eta_minutes }
                : (app.closest_rain_km != null && app.closest_rain_km <= VICINITY_MAX_KM
                    ? { dbz: app.closest_rain_intensity_dbz, km: app.closest_rain_km, cardinal: app.closest_rain_bearing_cardinal, eta: app.eta_minutes }
                    : null);
            if (cand && (!bestThreat || (cand.dbz || 0) > (bestThreat.dbz || 0))) bestThreat = cand;
        }
    }

    let ageMin = null;
    if (data && data.generated) ageMin = Math.round((Date.now() - new Date(data.generated).getTime()) / 60000);
    const ok = Object.values(sources).some(s => s && s.ok);
    // KANONSKI verdikt: precomputed once by the budva-radar pipeline
    // (radar/verdict.py, DHMZ nowcast = single source of truth) and rendered
    // verbatim on EVERY surface — this line, budva-radar index.html and
    // radar-map.html — so the pages can never disagree. The aggregation above
    // remains only as a fallback for radar_status.json from older pipelines.
    const verdict = sum.budva_verdict || null;
    const vf = (verdict && verdict.facts) || null;
    return {
        ok,
        verdict,
        rainAtLocation: vf ? !!vf.rainAtLocation
            : (sum.rain_at_location != null ? !!sum.rain_at_location : srcAtLoc),
        approaching:    vf ? !!vf.approaching
            : (sum.rain_approaching != null ? !!sum.rain_approaching : srcApproaching),
        anyRainVicinity: vf ? !!vf.anyRain
            : (sum.rain_in_vicinity != null ? !!sum.rain_in_vicinity : srcVicinity),
        etaMin:         vf && vf.eta != null ? vf.eta
            : (sum.closest_eta_minutes != null ? sum.closest_eta_minutes : srcEta),
        bestRain, threat: bestThreat, ageMin,
        severe: !!sum.severe_present,
    };
}

// Live hourly UV index for Budva from Open-Meteo. timezone=auto returns the hourly
// timestamps in Budva local time, matching the model's hourly_forecast[].datetime, so we
// can key UV onto every cell of the hourly strip (not just the current hour). The current
// card shows UV only when > 7 (see renderUvLine); the strip shows it for every daylight
// hour (see renderHourlyUv). UV is optional: any failure leaves the rows hidden.
const UV_URL = 'https://api.open-meteo.com/v1/forecast?latitude=42.2864&longitude=18.84'
             + '&hourly=uv_index&timezone=auto&forecast_days=3';

async function fetchUv() {
    try {
        const r = await fetch(UV_URL, { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        const times = j.hourly && j.hourly.time;
        const vals = j.hourly && j.hourly.uv_index;
        if (!times || !vals) return;
        uvByHour = {};
        for (let i = 0; i < times.length; i++) {
            if (vals[i] != null) uvByHour[times[i].slice(0, 13)] = vals[i];   // "YYYY-MM-DDTHH"
        }
        const now = new Date(), p = n => String(n).padStart(2, '0');
        const curKey = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}T${p(now.getHours())}`;
        currentUv = (uvByHour[curKey] != null) ? uvByHour[curKey] : null;
        renderUvLine();
        renderHourlyUv();
    } catch (e) { /* UV is optional; leave the rows hidden */ }
}

// WHO UV bands -> colour + Montenegrin label.
function uvBand(uv) {
    return uv >= 11 ? { c: '#6b49b6', t: 'ekstreman' }
         : uv >= 8  ? { c: '#d73a49', t: 'vrlo visok' }
         : uv >= 6  ? { c: '#e8590c', t: 'visok' }
         : uv >= 3  ? { c: '#f59f00', t: 'umjeren' }
         :            { c: '#1f883d', t: 'nizak' };
}

function renderUvLine() {
    const el = document.getElementById('cwUvDetail');
    if (!el) return;
    if (currentUv == null || currentUv <= 7) { el.style.display = 'none'; return; }
    const band = uvBand(currentUv);
    el.innerHTML = `<img src="${ICON_CDN}uv-index.svg" width="20" height="20" style="vertical-align:middle" alt="UV"> `
                 + `<span style="color:${band.c};font-weight:600">UV ${Math.round(currentUv)} (${band.t})</span>`;
    el.style.display = '';
}

// Fill the per-hour UV badge on each cell of the hourly strip from uvByHour. Hidden at
// night / very low UV (rounds to 0) to avoid clutter; coloured by WHO band otherwise.
function renderHourlyUv() {
    document.querySelectorAll('.hourly-cell[data-uvkey]').forEach(cell => {
        const el = cell.querySelector('.h-uv');
        if (!el) return;
        const uv = uvByHour[cell.getAttribute('data-uvkey')];
        if (uv == null || Math.round(uv) < 1) { el.style.display = 'none'; el.textContent = ''; return; }
        const band = uvBand(uv);
        el.textContent = 'UV ' + Math.round(uv);
        el.style.color = band.c;
        el.title = 'UV indeks: ' + band.t;
        el.style.display = '';
    });
}

function renderRadarStatusLine(state) {
    const el = document.getElementById('radarStatusLine');
    if (!el) return;
    if (!state || !state.ok) {
        el.style.color = '#777';
        el.style.fontWeight = '400';
        el.textContent = 'Radar: nedostupan';
        return;
    }

    const bestRain = state.bestRain;
    const age = state.ageMin != null ? ' · podatak star ' + state.ageMin + ' min' : '';
    const LINK = '<a href="https://matko-iv.github.io/budva-radar/">Radar</a>: ';

    // KANONSKI verdikt iz pipeline-a (vidi parseRadarState) — ista rečenica
    // kao zaključak na budva-radar stranicama, samo kraći format. Logika ispod
    // ostaje SAMO kao fallback za stari radar_status.json.
    const v = state.verdict;
    if (v && v.line_sr) {
        el.style.color = v.color_sr || '#777';
        el.style.fontWeight = String(v.weight_sr || 400);
        let line = v.line_sr;
        if (v.line_sr_bold && line.indexOf(v.line_sr_bold) !== -1) {
            line = line.replace(v.line_sr_bold, '<b>' + v.line_sr_bold + '</b>');
        }
        el.innerHTML = LINK + line + age;
        return;
    }

    // Format km with finer precision for sub-km echoes.
    function fmtKm(km) {
        if (km == null) return '?';
        if (km < 1) return km.toFixed(2);
        if (km < 10) return km.toFixed(1);
        return Math.round(km);
    }
    // Intensity from dBZ (light / moderate / heavy / hail), in Montenegrin.
    function intenzitet(dbz) {
        if (dbz == null || isNaN(dbz)) return 'kiša';
        if (dbz < 25) return 'slaba kiša';
        if (dbz < 40) return 'umjerena kiša';
        if (dbz < 50) return 'jaka kiša';
        return 'grad';
    }
    // English 8-point cardinal -> Montenegrin (S/I/J/Z based).
    const CARD_SR = { N:'S', NE:'SI', E:'I', SE:'JI', S:'J', SW:'JZ', W:'Z', NW:'SZ' };
    function smjer(c) { return c ? (CARD_SR[c] || c) : ''; }

    // SEVERE (≥50 dBZ) keyed off the nowcast's dominant approaching cell — mirrors
    // SKALA (skala-text.js) so this line never says "umjerena kiša" while the radar
    // page screams SEVERE. Priority matches SKALA: severe overhead, then ordinary
    // rain already falling (RAINING beats an approaching cell that hasn't arrived),
    // then a severe cell approaching, then ordinary approaching, blizu/zaobilazi…
    const SEVERE_DBZ = 50;
    const threat = state.threat;
    const severeHere = !!(state.rainAtLocation && bestRain && bestRain.dbz != null && bestRain.dbz >= SEVERE_DBZ);
    const severeApproaching = !!(state.approaching && threat && threat.dbz != null && threat.dbz >= SEVERE_DBZ);

    // Pixel-first model: kiša je "pada" SAMO ako je na tačnom pikselu Budve;
    // inače se ili približava (pašće) ili je blizu ali zaobilazi.
    if (severeHere) {
        el.style.color = '#6a1b9a';
        el.style.fontWeight = '700';
        el.innerHTML = LINK + '<b>jako nevrijeme nad Budvom</b> — ' + intenzitet(bestRain.dbz) +
                       ' (' + Math.round(bestRain.dbz) + ' dBZ)' + age;
    } else if (state.rainAtLocation && bestRain) {
        el.style.color = '#bf360c';
        el.style.fontWeight = '700';
        el.innerHTML = LINK + '<b>pada kiša u Budvi</b> — ' + intenzitet(bestRain.dbz) + age;
    } else if (severeApproaching) {
        const tEta = threat.eta != null ? ', ETA ~' + Math.round(threat.eta) + ' min' : '';
        const tDbz = threat.dbz != null ? ' (' + Math.round(threat.dbz) + ' dBZ)' : '';
        el.style.color = '#6a1b9a';
        el.style.fontWeight = '700';
        el.innerHTML = LINK + '<b>jako nevrijeme se približava</b> — ' + intenzitet(threat.dbz) + tDbz +
                       ', ~' + fmtKm(threat.km) + ' km ' + smjer(threat.cardinal) + tEta + age;
    } else if (state.approaching && bestRain) {
        const eta = state.etaMin != null ? ', ETA ~' + Math.round(state.etaMin) + ' min' : '';
        el.style.color = '#bf360c';
        el.style.fontWeight = '600';
        el.innerHTML = LINK + '<b>kiša se približava</b> — ' + intenzitet(bestRain.dbz) +
                       ', ~' + fmtKm(bestRain.km) + ' km ' + smjer(bestRain.cardinal) + eta + age;
    } else if (bestRain && bestRain.km != null && bestRain.km <= 20) {
        // "blizu/zaobilazi" samo unutar ~20 km — nikad za kišu stotinama km daleko.
        const move = bestRain.motionCardinal ? ' (ide ka ' + smjer(bestRain.motionCardinal) + ')' : '';
        el.style.color = '#1565c0';
        el.style.fontWeight = '600';
        el.innerHTML = LINK + '<b>kiša je blizu, ali zaobilazi Budvu</b> — ' + intenzitet(bestRain.dbz) +
                       ', ~' + fmtKm(bestRain.km) + ' km ' + smjer(bestRain.cardinal) + move + age;
    } else if (bestRain && bestRain.km != null) {
        // Kiša postoji ali dalje od ~20 km — nije relevantna za Budvu; navedi razdaljinu.
        el.style.color = '#2e7d32';
        el.style.fontWeight = '400';
        el.innerHTML = LINK + 'nema kiše ka Budvi (najbliža jeka ~' + fmtKm(bestRain.km) +
                       ' km ' + smjer(bestRain.cardinal) + ')' + age;
    } else {
        el.style.color = '#2e7d32';
        el.style.fontWeight = '400';
        el.innerHTML = LINK + 'nema padavina u okolini Budve' + age;
    }
}

// Radar se osvježava svake 2 min; inicijalno gejtovanje radi loadForecast().
setInterval(refreshRadar, 120000);
</script>
