name: Update Budva Weather Forecast

on:
  schedule:
    # Hourly. GitHub delays and sometimes skips scheduled runs under load, so
    # asking every hour keeps the published forecast fresh even when some are lost.
    - cron: '7 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

# Never run two forecasts at once; a run that starts meanwhile waits its turn.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # Open-Meteo 429 back-offs (60 s, then 135 s per model) can push a run past 20 min.
    timeout-minutes: 30
    env:
      # GitHub-hosted runners do not provide a GPU. Saved GPU-trained models
      # remain portable and are explicitly restored to CPU for inference here.
      FC_DEVICE: cpu
      # Use Montenegro local time (CET in winter, CEST in summer) for all
      # timestamps — Python pd.Timestamp.now(), bash date, etc.
      TZ: Europe/Podgorica

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Persist the Open-Meteo API response cache (trained_models_v2/api_cache)
      # ACROSS runs WITHOUT committing it to git. Previously the cache was
      # committed to the repo, and `git checkout` reset every file's mtime to
      # the checkout time, so the TTL freshness check (which used mtime) always
      # saw "0.0h" and NEVER refetched — the no-meta models (GFS/METEOFRANCE/
      # UKMO/KNMI/DMI) were frozen on stale data (weird long-range temps).
      # A unique key each run + a prefix restore-key gives a rolling "use the
      # most recent snapshot" cache. The code now also stores the real fetch
      # time in a `.fetched` sidecar, so age is correct even though cache
      # restore (like checkout) resets mtime.
      - name: Restore Open-Meteo API cache
        uses: actions/cache@v4
        with:
          path: trained_models_v2/api_cache
          key: om-api-cache-${{ github.run_id }}
          restore-keys: |
            om-api-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: |
          python test_forecast_core.py
          python test_gemini_narrative.py
          python test_narrative_variants.py
          node test_nowcast_hourly.js

      - name: Run forecast pipeline (skip training)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python forecast_48h_v3.py --skip-training

      - name: Copy forecast JSON to docs
        run: cp forecast_output/forecast_48h.json docs/forecast_data/forecast_48h.json

      - name: Commit and push updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main may have moved during the run (a manual or local forecast, a code
          # push). Re-apply this run's two files on top of the latest main instead
          # of rebasing, so a conflict on the forecast JSON can never fail the push.
          cp docs/forecast_data/forecast_48h.json "$RUNNER_TEMP/forecast_48h.json"
          cp forecast_output/gemini_narrative_cache.json "$RUNNER_TEMP/gemini_narrative_cache.json"
          msg="🌤️ Update forecast $(date +'%Y-%m-%d %H:%M %Z')"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/forecast_48h.json" docs/forecast_data/forecast_48h.json
            cp "$RUNNER_TEMP/gemini_narrative_cache.json" forecast_output/gemini_narrative_cache.json
            git add docs/forecast_data/forecast_48h.json forecast_output/gemini_narrative_cache.json
            git diff --staged --quiet && { echo "No changes to publish"; exit 0; }
            git commit -q -m "$msg"
            git push -q origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          exit 1
